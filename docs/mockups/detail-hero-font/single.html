<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>单机放大</title>
<style>
  /* 视口靠 iframe 的 390px 宽度来锁定：macOS 无头模式有最小窗宽（实测 500），
     直接给 --window-size=390 会得到 500 宽的布局再被裁掉右边，图就假了。 */
  html, body { margin: 0; padding: 0; background: #eef0f4; }
  body { width: 402px; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
  .lbl { font-size: 12px; font-weight: 600; color: #1f2329; padding: 8px 12px 4px; }
  .decl { font-size: 11px; line-height: 1.45; color: #5b6470; padding: 0 12px 6px; }
  .val { font-size: 11px; line-height: 1.45; color: #0c447c; padding: 0 12px 8px; }
  iframe { display: block; width: 390px; height: 620px; border: 0; background: #fff; }
</style>
</head>
<body>
<div class="lbl" id="lbl"></div>
<div class="decl" id="decl"></div>
<iframe id="fr" title="phone"></iframe>
<div class="val" id="val">实测：读取中…</div>
<script>
const q = new URLSearchParams(location.search)
const v = q.get('v') || 'current'
const name = q.get('name') || '裴珠泫 (배주현)'
const label = q.get('label') || v
const decl = q.get('decl') || ''
document.getElementById('lbl').textContent = label
document.getElementById('decl').textContent = decl

const iframe = document.getElementById('fr')
iframe.src = 'hero.html?' + new URLSearchParams({ v, name }).toString()

const fill = (m) => {
  if (!m) return false
  const fam = m.familyDeclared.split(',')[0].replace(/['"]/g, '')
  document.getElementById('val').textContent =
    `实测：${fam} · ${m.fontWeight} · ${parseFloat(m.fontSize).toFixed(2)}px · ` +
    `${m.lsEm.toFixed(3)}em · 行高 ${m.lhRatio.toFixed(2)}`
  return true
}
window.addEventListener('message', (e) => {
  if (e.source !== iframe.contentWindow) return
  const d = e.data
  if (d && d.type === 'hero-measured') fill(d.data)
})
iframe.addEventListener('load', () => {
  let n = 0
  const t = setInterval(() => {
    if (fill(iframe.contentWindow.__measured) || ++n > 200) clearInterval(t)
  }, 100)
})
</script>
</body>
</html>
